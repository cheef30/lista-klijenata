:root{
  --concrete:#E4E2DC; --paper:#F3F2EE; --ink:#1E262B; --steel:#55626A;
  --accent:__ACCENT__; --on-accent:__ON_ACCENT__; --plate-blue:#1F4AA8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--concrete);color:var(--ink);font-family:Manrope,sans-serif;-webkit-font-smoothing:antialiased}
.stripe{height:10px;background:__STRIPE__}
nav{display:flex;align-items:center;justify-content:space-between;padding:22px 64px}
.logo{font-family:"Barlow Condensed";font-weight:800;font-size:26px;letter-spacing:.01em}
.logo span{color:var(--steel);font-weight:600}
.links{display:flex;gap:34px;font-size:15px;font-weight:600;color:var(--steel)}
.navcta{background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:6px;font-weight:700;font-size:15px}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:56px;padding:64px 64px 56px;align-items:center}
h1{font-family:"Barlow Condensed";font-weight:800;font-size:128px;white-space:nowrap;line-height:.86;letter-spacing:-.01em;text-transform:none}
h1 .line2{display:block;color:var(--steel);font-weight:600}
.lede{margin-top:28px;font-size:20px;line-height:1.5;max-width:30ch;color:#2C363C}
.actions{margin-top:34px;display:flex;gap:14px;align-items:center}
.btn{background:var(--accent);color:var(--on-accent);font-weight:800;font-size:18px;padding:17px 28px;border-radius:8px}
.btn2{font-weight:700;font-size:17px;padding:17px 6px;border-bottom:2px solid var(--ink)}
.side{display:flex;flex-direction:column;gap:22px}
.plate{display:flex;height:112px;border:4px solid var(--ink);border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 18px 40px -18px rgba(30,38,43,.45)}
.plate .eu{width:56px;background:var(--plate-blue);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:12px;font-family:"Barlow Condensed";font-weight:800;font-size:20px}
.plate .eu i{display:block;width:26px;height:26px;border-radius:50%;border:2px dotted #F6D34A;margin-bottom:auto;margin-top:14px}
.plate .num{flex:1;display:flex;align-items:center;justify-content:center;font-family:"Barlow Condensed";font-weight:800;font-size:64px;letter-spacing:.02em;white-space:nowrap}
.platecap{font-size:15px;color:var(--steel);font-weight:600;margin-top:-8px}
.review{background:var(--paper);border-radius:10px;padding:24px 26px}
.stars{display:flex;align-items:baseline;gap:10px;font-weight:800;font-size:28px;font-family:"Barlow Condensed"}
.stars b{color:#E2A60B;letter-spacing:2px;font-size:22px}
.stars small{font-family:Manrope;font-weight:600;font-size:14px;color:var(--steel)}
.review p{margin-top:12px;font-size:17px;line-height:1.55}
.review cite{display:block;margin-top:10px;font-style:normal;font-size:14px;color:var(--steel);font-weight:600}
.services{display:flex;border-top:2px solid var(--ink);margin:0 64px}
.services div{flex:1;padding:22px 24px 30px 0;font-family:"Barlow Condensed";font-weight:600;font-size:27px;line-height:1.1}
.services div+div{padding-left:24px;border-left:1px solid #B9BCBA}

/* PVC: prozor */
.win{position:relative;height:220px;border:16px solid #FBFBF9;border-radius:6px;background:linear-gradient(170deg,#BFD9E8 0%,#E6F0F4 55%,#CFE0D6 100%);box-shadow:inset 0 0 0 2px #D6D6D0,0 22px 44px -22px rgba(30,38,43,.5);display:grid;grid-template-columns:1fr 1fr}
.win:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 38%,transparent 46%)}
.win div{border:10px solid #FBFBF9;margin:-10px;box-shadow:inset 0 0 0 1px #D6D6D0}
.win i{position:absolute;right:calc(50% + 14px);top:46%;width:8px;height:44px;border-radius:4px;background:#C9CBC6;z-index:2}
.wincall{display:flex;justify-content:space-between;align-items:baseline;font-family:"Barlow Condensed";font-weight:800;font-size:44px}
.wincall small{font-family:Manrope;font-weight:600;font-size:15px;color:var(--steel)}
body.m .win{height:190px;border-width:11px}
body.m .wincall{font-size:34px;flex-direction:column;align-items:flex-start;gap:2px;white-space:nowrap}
/* nekretnine: pretraga */
.search{background:#fff;border-radius:12px;padding:10px;display:grid;grid-template-columns:1.2fr 1fr auto;gap:8px;box-shadow:0 22px 44px -24px rgba(30,38,43,.45)}
.search div{padding:12px 14px;border-radius:8px;background:var(--paper);font-size:15px;font-weight:600}
.search div small{display:block;font-size:12px;color:var(--steel);font-weight:600;margin-bottom:2px}
.search span{background:var(--accent);color:var(--on-accent);border-radius:8px;padding:0 20px;display:flex;align-items:center;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tiles div{border-radius:10px;padding:16px 14px 14px;font-family:"Barlow Condensed";font-weight:800;font-size:24px;color:#fff;min-height:96px;display:flex;align-items:flex-end}
body.m .search{grid-template-columns:1fr}
body.m .search span{padding:12px;justify-content:center}
body.m .tiles{grid-template-columns:1fr 1fr}
/* mobile */
body.m nav{padding:16px 20px}
body.m .links{display:none}
body.m .navcta{padding:9px 14px;font-size:14px}
body.m .logo{font-size:22px}
body.m .hero{grid-template-columns:1fr;padding:28px 20px 24px;gap:26px}
body.m h1{font-size:62px;white-space:normal}
body.m .lede{font-size:17px;margin-top:18px}
body.m .actions{margin-top:22px;flex-direction:column;align-items:stretch}
body.m .btn{text-align:center}
body.m .btn2{display:none}
body.m .plate{height:76px}
body.m .plate .num{font-size:40px}
body.m .plate .eu{width:40px;font-size:15px}
body.m .plate .eu i{width:18px;height:18px;margin-top:9px}
body.m .services{margin:0 20px;flex-direction:column}
body.m .services div{padding:14px 0;font-size:23px}
body.m .services div+div{padding-left:0;border-left:0;border-top:1px solid #B9BCBA}
body.m .review{display:none}
</style>

</nav>
<section class="hero">
  <div>
    <h1>__H1A__<span class="line2">__H1B__</span></h1>
    <p class="lede">__LEDE__</p>
    <div class="actions"><span class="btn">__CTA__</span><span class="btn2">__CTA2__</span></div>
  </div>
  <div class="side">
    __SIDE__
    <div class="review">
      <div class="stars">__RT__ <b>★★★★★</b><small>__REV__ recenzija na Google-u</small></div>
      <p>„__QUOTE__“</p>
      <cite>__QBY__</cite>
    </div>
  </div>
</section>
<div class="services">__SERVICES__</div>
</body>
</html>
