<!doctype html><html lang="sr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F2;--ink:#1B2620;--muted:#57635C;--accent:#3F6B54;--on:#FFFFFF;--card:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:Lato,sans-serif;-webkit-font-smoothing:antialiased}
nav{display:flex;align-items:center;justify-content:space-between;padding:24px 56px;position:relative;z-index:3}
.logo{font-family:"Playfair Display",serif;font-weight:700;font-size:26px;letter-spacing:.01em}
.links{display:flex;gap:30px;font-size:15px;font-weight:600;color:var(--muted)}
.call{background:var(--accent);color:var(--on);padding:11px 20px;border-radius:8px;font-weight:700;font-size:15px}
h1{font-family:"Playfair Display",serif;font-weight:700;line-height:.98;letter-spacing:-.015em}
.lede{font-size:19px;line-height:1.55;color:var(--muted);max-width:36ch}
.cta{display:inline-block;background:var(--accent);color:var(--on);padding:16px 26px;border-radius:10px;font-weight:700;font-size:17px}
.ghost{display:inline-block;padding:16px 6px;font-weight:700;font-size:16px;border-bottom:2px solid currentColor}
.rate{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--muted)}
.rate b{font-family:"Playfair Display",serif;font-size:30px;color:var(--ink)}
.rate i{font-style:normal;color:#E7A912;letter-spacing:1px}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0 56px 26px}
.gal figure{border-radius:10px;overflow:hidden;background:var(--card)}
.gal div{height:128px;background:center/cover}
.gal figcaption{padding:11px 14px;font-weight:700;font-size:15px}
.quote{background:var(--card);border-radius:12px;padding:20px 22px;font-size:16px;line-height:1.55}
.quote cite{display:block;margin-top:8px;font-style:normal;font-size:13px;color:var(--muted);font-weight:600}
.bar{position:relative;z-index:3;margin:-46px 56px 0;background:var(--card);border-radius:14px;display:grid;grid-template-columns:1fr 1fr 1fr auto;box-shadow:0 22px 44px -24px rgba(0,0,0,.45)}
.bar div{padding:16px 22px;border-right:1px solid rgba(0,0,0,.08)}
.bar small{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.04em}
.bar strong{font-size:16px;font-weight:600}
.bar a{background:var(--accent);color:var(--on);margin:9px;border-radius:10px;display:flex;align-items:center;padding:0 26px;font-weight:700;font-size:15px}
.revs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:0 56px 40px}
.revs h3{grid-column:1/-1;font-family:"Playfair Display",serif;font-weight:700;font-size:24px;margin-bottom:0}
.revs div{background:var(--card);border-radius:12px;padding:14px 18px;font-size:14px;line-height:1.5}
.revs div:before{content:"★★★★★";display:block;color:#E7A912;letter-spacing:2px;font-size:13px;margin-bottom:6px}
.revs cite{display:block;margin-top:8px;font-style:normal;font-size:13px;color:var(--muted);font-weight:700}
/* split */
.split{display:grid;grid-template-columns:1fr 1.05fr;gap:48px;padding:10px 56px 22px;align-items:center}
.split h1{font-size:76px}
.split .lede{margin-top:22px}
.split .acts{margin-top:30px;display:flex;gap:16px;align-items:center}
.split .rate{margin-top:30px}
.photo{height:400px;border-radius:16px;background:center/cover;position:relative}
.photo .quote{position:absolute;left:-36px;bottom:26px;max-width:330px;box-shadow:0 20px 40px -20px rgba(0,0,0,.4)}
/* full */
.full{position:relative;height:var(--fh,600px);margin-top:-82px;background:center/cover;display:flex;align-items:flex-end}
.full:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 30%,rgba(0,0,0,.1) 50%,rgba(0,0,0,.78))}
.full .in{position:relative;padding:0 56px 56px;color:#fff;display:flex;justify-content:space-between;align-items:flex-end;width:100%;gap:40px}
.full h1{font-size:76px}
.full .lede{color:rgba(255,255,255,.9);margin-top:16px}
.full .acts{margin-top:26px;display:flex;gap:16px;align-items:center}
.full .rate,.full .rate b{color:#fff}
body.dark nav,body.fullnav nav{color:#fff}
body.fullnav .links{color:rgba(255,255,255,.85)}
.band{display:flex;gap:0;padding:26px 56px 30px}
.band div{flex:1;padding-right:20px;font-family:"Playfair Display",serif;font-weight:700;font-size:22px;border-left:3px solid var(--accent);padding-left:14px}
@media (max-width:600px){
 nav{padding:16px 18px}.links{display:none}.logo{font-size:21px}.call{padding:9px 13px;font-size:13px}
 .split{grid-template-columns:1fr;padding:6px 18px 22px;gap:22px}.split h1{font-size:44px}.lede{font-size:16px}
 .split .acts{flex-direction:column;align-items:stretch;text-align:center}.ghost{display:none}
 .photo{height:250px}.photo .quote{display:none}
 .full{height:650px;margin-top:-66px}.full:before{background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 22%,rgba(0,0,0,.35) 45%,rgba(0,0,0,.85))}.full .in{flex-direction:column;align-items:flex-start;padding:0 18px 26px;gap:18px}.full h1{font-size:44px}
 .full .acts{flex-direction:column;align-items:stretch;text-align:center;width:100%}
 .gal{grid-template-columns:1fr 1fr;padding:0 18px 20px;gap:10px}.gal div{height:110px}
 .band{flex-direction:column;gap:12px;padding:18px}
 .bar{margin:12px 16px 0;grid-template-columns:1fr 1fr}.bar div:nth-child(3){display:none}.bar a{grid-column:1/3;justify-content:center;padding:13px}
 .revs{grid-template-columns:1fr;padding:0 18px 24px}.revs div:nth-child(n+3){display:none}.revs h3{font-size:22px}

}
</style></head><body class="fullnav" style="--fh:600px">
<nav><div class="logo">Vila Vrh</div><div class="links"><span>Studija</span><span>Galerija</span><span>Stara planina</span><span>Kontakt</span></div><span class="call">063 406 796</span></nav>
<section class="full" style="background-image:url({{I0}})"><div class="in"><div><h1>Vila Vrh,<br>Stara planina</h1><p class="lede">Novi i čisti studiji pored potoka, 15 minuta vožnje do gondole. Domaćin Boban je tu za sve.</p><div class="acts"><span class="cta">Proverite termine</span><span class="ghost">Studiji</span></div></div><div class="rate"><b>4,9</b><span><i>★★★★★</i><br>113 recenzija na Google-u</span></div></div></section>

<section class="gal" style="padding-top:18px"><figure><div style="background-image:url({{I1}})"></div><figcaption>Studio</figcaption></figure><figure><div style="background-image:url({{I2}})"></div><figcaption>Dnevni deo</figcaption></figure><figure><div style="background-image:url({{I3}})"></div><figcaption>Kuhinja</figcaption></figure><figure><div style="background-image:url({{I4}})"></div><figcaption>Priroda</figcaption></figure></section>

</body></html>
